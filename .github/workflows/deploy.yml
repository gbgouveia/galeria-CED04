name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # O postinstall copia os modelos de reconhecimento facial para public/models
      - run: npm ci

      - run: npm test

      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Conferir arquivos essenciais no build
        run: |
          test -f dist/index.html
          test -f dist/models/ssd_mobilenetv1_model.bin
          test -f dist/models/face_recognition_model.bin
          echo "Fotos originais: $(ls dist/photos | wc -l)"
          echo "Miniaturas:      $(ls dist/thumbnails | wc -l)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
